[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proper-validation"
version = "0.1.0"
description = "An adversarial validator for quantitative backtests. It falsifies; it cannot validate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gergo Honyak" }]
keywords = ["backtest", "overfitting", "deflated-sharpe", "quant", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "typer>=0.9",
    "nbformat>=5.9",
    "platformdirs>=4.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# The engine never touches the network. Loaders are an opt-in extra so that
# the whole statistical core installs and tests without any network stack.
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/honyakgergo/proper-validation"
Repository = "https://github.com/honyakgergo/proper-validation"
Issues = "https://github.com/honyakgergo/proper-validation/issues"

[project.scripts]
qv = "qv.cli:app"

[tool.setuptools.packages.find]
include = ["qv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access (deselected by default)",
    "slow: test takes more than a few seconds",
]
addopts = "-m 'not network' --strict-markers"

[tool.coverage.run]
source = ["qv"]
omit = ["qv/data/loaders.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
